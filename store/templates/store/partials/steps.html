<ol class="steps" aria-label="Checkout progress">
  <li class="{% if current > 1 %}is-done{% elif current == 1 %}is-current{% endif %}" {% if current == 1 %}aria-current="step"{% endif %}><span>1</span>Cart</li>
  <li class="{% if current > 2 %}is-done{% elif current == 2 %}is-current{% endif %}" {% if current == 2 %}aria-current="step"{% endif %}><span>2</span>Delivery Details</li>
  <li class="{% if current > 3 %}is-done{% elif current == 3 %}is-current{% endif %}" {% if current == 3 %}aria-current="step"{% endif %}><span>3</span>Payment</li>
  <li class="{% if current == 4 %}is-current{% endif %}" {% if current == 4 %}aria-current="step"{% endif %}><span>4</span>Confirmation</li>
</ol>
