<header class="navbar" id="navbar">
  <div class="container navbar__inner">
    <a class="brand" href="{% url 'store:home' %}" aria-label="Agri-Acoustic home">
      {% include "store/partials/logo.html" %}<span>Agri-Acoustic</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="{% url 'store:home' %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>Home</a>
      <a href="{% url 'store:home' %}#about">About</a>
      <a href="{% url 'store:products' %}" {% if request.resolver_match.url_name == 'products' %}aria-current="page"{% endif %}>Products</a>
      <a href="{% url 'store:home' %}#sustainability">Sustainability</a>
      <a href="#contact">Contact</a>
      <a class="btn btn--primary nav__buy" href="{% url 'store:products' %}">Buy Now</a>
    </nav>
    <div class="navbar__actions">
      <a class="cart-link" href="{% url 'store:cart' %}" aria-label="Shopping cart, 0 items" id="cart-link">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
        <span class="cart-count" id="cart-count" hidden>0</span>
      </a>
      <a class="btn btn--primary navbar__buy" href="{% url 'store:products' %}">Buy Now</a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
